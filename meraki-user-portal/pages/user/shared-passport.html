<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Passport — Meraki AutoChain</title>
<link rel="stylesheet" href="/meraki-user-portal/css/global.css" />
<link rel="stylesheet" href="/meraki-user-portal/css/shared-passport.css" />
</head>
<body>
<div class="public-page">

  <header class="public-header">
    <div class="wordmark">Meraki<span>.</span></div>
  </header>

  <main class="public-main" id="public-main">
    <div id="loading-state">
      <p>Loading vehicle passport…</p>
    </div>

    <div id="error-state" style="display:none;">
      <h2>Link not found</h2>
      <p>This share link is invalid, has expired, or was revoked by the vehicle owner.</p>
    </div>

    <div id="passport-content" style="display:none;">
      <div class="passport-header">
        <div>
          <h1 id="passport-vehicle-name">—</h1>
          <p id="passport-vehicle-sub">—</p>
        </div>
        <span class="badge" id="passport-status-badge">—</span>
      </div>

      <div class="passport-meta">
        <div><span>Meraki ID</span><strong id="passport-meraki-id">—</strong></div>
        <div><span>Color</span><strong id="passport-color">—</strong></div>
        <div><span>Inspections on record</span><strong id="passport-inspection-count">—</strong></div>
        <div><span>Last inspected</span><strong id="passport-last-inspected">—</strong></div>
      </div>

      <div class="passport-actions">
        <button class="btn btn-ghost btn-sm" id="copy-link-btn">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="5" y="5" width="9" height="9" rx="1"/>
            <path d="M11 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v7a1 1 0 001 1h2"/>
          </svg>
          Copy Link
        </button>
        <button class="btn btn-ghost btn-sm" id="print-btn">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="12" height="10" rx="1"/>
            <path d="M6 4v2M10 4v2M4 12h8"/>
          </svg>
          Print
        </button>
      </div>

      <h3>Inspection history</h3>
      <div id="inspections-list"></div>
    </div>
  </main>

  <footer class="public-footer">
    <p>Verified on Meraki AutoChain — Kenya's vehicle trust infrastructure.</p>
  </footer>

</div>

<script src="/meraki-user-portal/js/shared/api.js"></script>
<script src="/meraki-user-portal/js/user/shared-passport.js"></script>
</body>
</html>
