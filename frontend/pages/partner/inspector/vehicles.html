<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles — Meraki AutoChain</title>
  <link rel="stylesheet" href="../../../css/global.css">
  <link rel="stylesheet" href="../../../css/partner.css">
  <link rel="stylesheet" href="../../../css/inspector.css">
</head>
<body>

<div class="app-root">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-breadcrumb">Inspector Portal</div>
        <div class="topbar-title">Vehicles</div>
      </div>
      <div class="topbar-right">
        <div class="profile-dropdown-wrap">
          <div class="profile-trigger" id="profile-trigger">
            <div class="profile-avatar" id="profile-avatar"></div>
            <div class="profile-name" id="profile-name"></div>
            <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5" stroke-linecap="round"/></svg>
          </div>
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="profile-dropdown-header">
              <div class="profile-dropdown-name" id="dd-name"></div>
              <div class="profile-dropdown-email" id="dd-email"></div>
            </div>
            <div class="profile-dropdown-item" data-action="logout">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17H4.5A1.5 1.5 0 013 15.5v-11A1.5 1.5 0 014.5 3H8"/><path d="M13 14l4-4-4-4M17 10H8"/></svg>
              Sign out
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-eyebrow">Records</div>
          <h1 class="page-title">Inspected Vehicles</h1>
          <p class="page-subtitle">All vehicles you have submitted inspection records for.</p>
        </div>
        <div class="page-header-actions">
          <a href="new-inspection.html" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
            New Inspection
          </a>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="9" cy="9" r="5.5"/>
            <path d="M15.5 15.5l-3-3"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search by registration, make or model...">
        </div>
        <select class="filter-select" id="status-filter">
          <option value="">All statuses</option>
          <option value="verified">Verified</option>
          <option value="pending">Pending</option>
          <option value="unverified">Unverified</option>
        </select>
      </div>

      <div class="panel">
        <div class="panel-body-flush">
          <table class="data-table">
            <thead>
              <tr>
                <th>Reg No.</th>
                <th>Make / Model</th>
                <th>Year</th>
                <th>Mileage</th>
                <th>Inspected</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="vehicles-tbody">
              <tr>
                <td colspan="7">
                  <div class="empty-state">
                    <p>Loading vehicle records...</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../../../js/partner/router.js"></script>
<script src="../../../js/partner/sidebar.js"></script>
<script src="../../../js/partner/profile.js"></script>
<script src="../../../js/inspector/vehicles.js"></script>
</body>
</html>
