<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Requests — Meraki AutoChain Dealer</title>
  <link rel="stylesheet" href="../../../css/global.css">
  <link rel="stylesheet" href="../../../css/partner.css">
  <link rel="stylesheet" href="../../../css/dealer.css">
</head>
<body>

<div class="app-root">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-breadcrumb">Dealer Portal</div>
        <div class="topbar-title">Verification Requests</div>
      </div>
      <div class="topbar-right">
        <div class="profile-dropdown-wrap">
          <div class="profile-trigger" id="profile-trigger">
            <div class="profile-avatar" id="profile-avatar"></div>
            <div class="profile-name" id="profile-name"></div>
            <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5" stroke-linecap="round"/></svg>
          </div>
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="profile-dropdown-header">
              <div class="profile-dropdown-name" id="dd-name"></div>
              <div class="profile-dropdown-email" id="dd-email"></div>
            </div>
            <div class="profile-dropdown-item" data-action="logout">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17H4.5A1.5 1.5 0 013 15.5v-11A1.5 1.5 0 014.5 3H8"/><path d="M13 14l4-4-4-4M17 10H8"/></svg>
              Sign out
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <div class="page-header-left">
          <div class="page-eyebrow">Verification</div>
          <h1 class="page-title">Inspection Requests</h1>
          <p class="page-subtitle">Track the status of all inspections requested for your vehicles.</p>
        </div>
        <div class="page-header-actions">
          <a href="inventory.html" class="btn btn-ghost btn-sm">Back to Inventory</a>
        </div>
      </div>

      <!-- Stats row -->
      <div class="stats-grid stats-grid-3" style="margin-bottom:24px">
        <div class="stat-cell">
          <div class="stat-label">Total Requests</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Completed</div>
          <div class="stat-value text-accent" id="stat-completed">—</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">—</div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="9" cy="9" r="5.5"/>
            <path d="M15.5 15.5l-3-3"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search by registration number...">
        </div>
        <select class="filter-select" id="status-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="assigned">Assigned</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="panel">
        <div class="panel-body-flush">
          <div class="request-list" id="request-list">
            <div class="empty-state">
              <p>Loading verification requests...</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../../../js/partner/router.js"></script>
<script src="../../../js/partner/sidebar.js"></script>
<script src="../../../js/partner/profile.js"></script>
<script src="../../../js/dealer/requests.js"></script>
</body>
</html>
